name: CI

# Runs on every push to main/develop and every pull request, so a broken
# change is caught before it's merged — separate from publish.yml, which
# only runs when an actual release tag is pushed.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Type-check
        run: bun run compile

      - name: Install vsce
        run: bun install -g @vscode/vsce

      - name: Package extension (dry run, not published)
        run: vsce package

      - name: Upload .vsix as a PR artifact
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: "*.vsix"
