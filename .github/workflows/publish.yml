name: Publish Extension

# Runs whenever a tag like v0.0.* is pushed, or manually via the Actions tab
# ("Run workflow") to cut that tag in the first place.
#
# A pushed tag never retriggers a second workflow run when the push is made
# with the default GITHUB_TOKEN from inside a job — GitHub explicitly
# suppresses that to prevent infinite loops. So a manual run can't just push
# a tag and rely on `push: tags:` picking it up afterwards; instead
# build-and-verify runs in the SAME run as cut-tag (via `needs:`), checking
# out the tag cut-tag just created.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, preview]
        default: preview
        required: true
      increment:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

jobs:
  cut-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cut and push the release tag
        id: cut
        run: |
          # Reuses the same scripts a human would run locally, so the manual
          # and local paths can never diverge in behavior.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.channel }}" = "preview" ]; then
            bash scripts/release-preview.sh "${{ inputs.increment }}"
          else
            bun run release "${{ inputs.increment }}"
          fi

          TAG=$(git tag --points-at HEAD)
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Builds the .vsix once and verifies it installs. Every later job reuses
  # this exact artifact instead of rebuilding — what gets published and what
  # got install-tested are then guaranteed to be the same file.
  build-and-verify:
    needs: cut-tag
    if: always() && (needs.cut-tag.result == 'success' || needs.cut-tag.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On a manual run there's no tag ref to default to yet — check out
          # the one cut-tag just pushed. On a tag push, github.ref_name IS
          # that tag already.
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.cut-tag.outputs.tag || github.ref_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install vsce
        run: bun install -g @vscode/vsce

      - name: Install dependencies
        run: bun install

      - name: Resolve tag and verify it matches package.json version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_VERSION="${{ needs.cut-tag.outputs.tag }}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/}"
          fi

          # A semver prerelease suffix (v1.2.3-preview.1) marks a preview build,
          # published to the Marketplace's separate Pre-Release track and
          # flagged as a GitHub "Pre-release". The Marketplace rejects a
          # prerelease version string outright, so package.json must always
          # carry just the plain base version (1.2.3) — only the git tag gets
          # the -preview.N suffix. Strip it off before comparing the two.
          if [[ "$TAG_VERSION" == *-* ]]; then
            BASE_VERSION="${TAG_VERSION%%-*}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            BASE_VERSION="$TAG_VERSION"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          PKG_VERSION="v$(bun -e "console.log(require('./package.json').version)")"
          if [ "$PKG_VERSION" != "$BASE_VERSION" ]; then
            echo "Tag's base version ($BASE_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: bun test

      - name: Package extension
        run: vsce package ${{ steps.tag.outputs.prerelease == 'true' && '--pre-release' || '' }}

      - name: Cache VS Code test download
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test

      - name: Verify extension installs correctly
        run: bun scripts/verify-install.ts *.vsix

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

  publish-marketplace:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        run: |
          vsce publish -p ${{ secrets.VSCE_PAT }} \
            --packagePath *.vsix \
            ${{ needs.build-and-verify.outputs.prerelease == 'true' && '--pre-release' || '' }}

  create-release:
    needs: [build-and-verify, publish-marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for `gh release create`
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download .vsix
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build-and-verify.outputs.version }}" *.vsix \
            --title "${{ needs.build-and-verify.outputs.version }}" \
            --generate-notes \
            ${{ needs.build-and-verify.outputs.prerelease == 'true' && '--prerelease' || '' }}
