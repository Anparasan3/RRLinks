name: Publish Extension

# Runs whenever a tag like v0.0.* is pushed
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install vsce
        run: bun install -g @vscode/vsce

      - name: Install dependencies
        run: bun install

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(bun -e "console.log(require('./package.json').version)")"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: bun test

      - name: Package extension
        run: vsce package

      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_PAT }}

      - name: Upload .vsix as release artifact
        uses: actions/upload-artifact@v7
        with:
          name: vsix-package
          path: "*.vsix"