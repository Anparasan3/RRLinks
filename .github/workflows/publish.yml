name: Publish Extension

# Runs whenever a tag like v0.0.* is pushed. Can also be triggered manually
# via the Actions tab ("Run workflow") to cut that tag in the first place —
# the cut-tag job just bumps/commits/tags/pushes, then the tag push it makes
# triggers this same workflow again through the normal `push: tags:` path,
# so the actual publish logic below only ever runs once, the same way
# whether a human pushed the tag locally or triggered it from the UI.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, preview]
        default: preview
        required: true
      increment:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

jobs:
  cut-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cut and push the release tag
        run: |
          # Reuses the same scripts a human would run locally, so the manual
          # and local paths can never diverge in behavior.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.channel }}" = "preview" ]; then
            bash scripts/release-preview.sh "${{ inputs.increment }}"
          else
            bun run release "${{ inputs.increment }}"
          fi

          TAG=$(git tag --points-at HEAD)
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "$TAG"
          echo "Pushed $TAG — the publish job will pick it up from here."

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for `gh release create`
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install vsce
        run: bun install -g @vscode/vsce

      - name: Install dependencies
        run: bun install

      - name: Verify tag matches package.json version
        id: tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          # A semver prerelease suffix (v1.2.3-preview.1) marks a preview build,
          # published to the Marketplace's separate Pre-Release track and
          # flagged as a GitHub "Pre-release". The Marketplace rejects a
          # prerelease version string outright, so package.json must always
          # carry just the plain base version (1.2.3) — only the git tag gets
          # the -preview.N suffix. Strip it off before comparing the two.
          if [[ "$TAG_VERSION" == *-* ]]; then
            BASE_VERSION="${TAG_VERSION%%-*}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            BASE_VERSION="$TAG_VERSION"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          PKG_VERSION="v$(bun -e "console.log(require('./package.json').version)")"
          if [ "$PKG_VERSION" != "$BASE_VERSION" ]; then
            echo "Tag's base version ($BASE_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: bun test

      - name: Package extension
        run: vsce package ${{ steps.tag.outputs.prerelease == 'true' && '--pre-release' || '' }}

      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: ${{ runner.os }}-vscode-test

      - name: Verify extension installs correctly
        run: bun scripts/verify-install.ts *.vsix

      - name: Publish to VS Code Marketplace
        run: vsce publish -p ${{ secrets.VSCE_PAT }} ${{ steps.tag.outputs.prerelease == 'true' && '--pre-release' || '' }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.version }}" *.vsix \
            --title "${{ steps.tag.outputs.version }}" \
            --generate-notes \
            ${{ steps.tag.outputs.prerelease == 'true' && '--prerelease' || '' }}
